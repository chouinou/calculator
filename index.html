<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Extra calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Press buttons, do math, easy.</h1>
    <div class="wrapper">
        <div class="screen">
            <div class="screen-last" id="lastOperationScreen"></div>
            <div class="screen-current" id="currentOperationScreen">0</div>
            <p id="screen-text">20</p>
        </div>

        <div class="calc-display">
            <div class="button-row">
                <button class="calc-button" id="clear">C</button>
                <button class="calc-button">arrow</button>
            </div>

            <div class="button-row">
                <button class="calc-button">7</button>
                <button class="calc-button">8</button>
                <button class="calc-button">9</button>
                <button class="calc-button" id="plus">+</button>
            </div>

            <div class="button-row">
                <button class="calc-button">4</button>
                <button class="calc-button">5</button>
                <button class="calc-button">6</button>
                <button class="calc-button" id="minus">-</button>
            </div>

            <div class="button-row">
                <button class="calc-button">1</button>
                <button class="calc-button">2</button>
                <button class="calc-button">3</button>
                <button class="calc-button" id="multiply">x</button>
            </div>

            <div class="button-row">
                <button class="calc-button">0</button>
                <button class="calc-button" id="equal">=</button>
                <button class="calc-button" id="divide">/</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>

<footer class="footer">
      <p> Copyright © 2026 chouinou </p>
      <a href="https://github.com/chouinou" target="_blank">
        <img class="github-logo" src="./img/github-mark.svg">
      </a>
    </footer>

</html>
