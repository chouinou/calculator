<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Extra calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Press buttons, do math, easy.</h1>
    <div class="wrapper">
        <div class="screen">
            <p id="screen-text">0</p>
        </div>

        <div class="calc-buttons">
            <div class="button-row">
                <button class="calc-button">C</button>
                <button class="calc-button">arrow</button>
                <button class="calc-button">/</button>
            </div>

            <div class="button-row">
                <button class="calc-button">7</button>
                <button class="calc-button">8</button>
                <button class="calc-button">9</button>
                <button class="calc-button">+</button>
            </div>

            <div class="button-row">
                <button class="calc-button">4</button>
                <button class="calc-button">5</button>
                <button class="calc-button">6</button>
                <button class="calc-button">-</button>
            </div>

            <div class="button-row">
                <button class="calc-button">1</button>
                <button class="calc-button">2</button>
                <button class="calc-button">3</button>
                <button class="calc-button">X</button>
            </div>

            <div class="button-row">
                <button class="calc-button">0</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>

<footer class="footer">
      <p> Copyright © 2026 chouinou </p>
      <a href="https://github.com/chouinou" target="_blank">
        <img class="github-logo" src="./img/github-mark.svg">
      </a>
    </footer>

</html>
